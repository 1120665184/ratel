services:
  ratel:
    build:
      context: ../..
      dockerfile: docker/single/Dockerfile
    container_name: ratel
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-gwsu}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ratel-net

  postgres:
    image: postgres:16-alpine
    container_name: ratel-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gwsu}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - ../initdb:/initdb
      - ../initdb/init-postgre.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ratel-net

  redis:
    image: redis:7-alpine
    container_name: ratel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - ratel-net

volumes:
  redis-data:

networks:
  ratel-net:
    driver: bridge
