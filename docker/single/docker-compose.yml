services:
  ratel-manager:
    build:
      context: ../..
      dockerfile: docker/single/Dockerfile
    container_name: ratel-manager
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-gwsu}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
      - ES_URL=${ES_URL:-http://elasticsearch:9200}
      - ES_USERNAME=${ES_USERNAME:-elastic}
      - ES_PASSWORD=${ES_PASSWORD:-elastic}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,redis,elasticsearch}
    dns:
      - 8.8.8.8
      - 114.114.114.114
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - ratel-net

  postgres:
    image: postgres:16-alpine
    container_name: ratel-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gwsu}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../initdb:/initdb
      - ../initdb/init-postgre.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ratel-net

  redis:
    image: redis:7-alpine
    container_name: ratel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ratel-net

  elasticsearch:
    image: elasticsearch:9.4.3
    container_name: ratel-elasticsearch
    environment:
      TZ: Asiz/Shanghai
      cluster.name: es9
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ES_PASSWORD:-elastic}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: false
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ES_PASSWORD:-elastic} http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ratel-net


networks:
  ratel-net:
    driver: bridge
