server {
    listen 80;

    # 主应用
    location / {
        root /usr/share/nginx/html/main;
        try_files $uri $uri/ /index.html;
    }

    # 子应用 - 系统管理
    location /sub-system {
        alias /usr/share/nginx/html/sub-system;
        try_files $uri $uri/ /sub-system/index.html;
    }

    # 子应用 - 安全中心
    location /sub-security {
        alias /usr/share/nginx/html/sub-security;
        try_files $uri $uri/ /sub-security/index.html;
    }

    # API 转发到后端（strip /api 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
