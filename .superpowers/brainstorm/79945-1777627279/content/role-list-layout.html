<h2>角色管理 - 页面布局方案</h2>
<p class="subtitle">选择角色列表页的整体布局模式</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#fff;border-radius:8px;padding:12px;font-size:11px;color:#333">
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <div style="flex:1;border:1px solid #d9d9d9;border-radius:4px;padding:4px 8px;color:#999">角色名称</div>
          <div style="border:1px solid #d9d9d9;border-radius:4px;padding:4px 8px;color:#999;width:80px">角色类型</div>
          <div style="border:1px solid #d9d9d9;border-radius:4px;padding:4px 8px;color:#999;width:80px">数据范围</div>
          <div style="border:1px solid #d9d9d9;border-radius:4px;padding:4px 8px;color:#999;width:80px">状态</div>
          <div style="background:#1677ff;color:#fff;border-radius:4px;padding:4px 12px;font-size:11px">查询</div>
          <div style="border:1px solid #d9d9d9;border-radius:4px;padding:4px 12px;font-size:11px">重置</div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <div style="background:#1677ff;color:#fff;border-radius:4px;padding:4px 12px;font-size:11px">+ 新增</div>
        </div>
        <div style="border:1px solid #f0f0f0;border-radius:4px">
          <div style="display:flex;background:#fafafa;padding:6px 8px;border-bottom:1px solid #f0f0f0;font-weight:500">
            <div style="width:40px">序号</div>
            <div style="flex:1">角色编码</div>
            <div style="flex:1">角色名称</div>
            <div style="width:80px">角色类型</div>
            <div style="width:80px">数据范围</div>
            <div style="width:60px">状态</div>
            <div style="width:160px">操作</div>
          </div>
          <div style="display:flex;padding:8px 8px;border-bottom:1px solid #f0f0f0;font-size:11px">
            <div style="width:40px;color:#999">1</div>
            <div style="flex:1">admin</div>
            <div style="flex:1">系统管理员</div>
            <div style="width:80px"><span style="background:#e6f7ff;color:#1677ff;padding:1px 6px;border-radius:2px;font-size:10px">系统角色</span></div>
            <div style="width:80px">全部数据</div>
            <div style="width:60px"><span style="background:#f6ffed;color:#52c41a;padding:1px 6px;border-radius:2px;font-size:10px">启用</span></div>
            <div style="width:160px;display:flex;gap:4px;align-items:center">
              <a style="color:#1677ff;font-size:11px">详情</a>
              <a style="color:#1677ff;font-size:11px">更多 ▾</a>
            </div>
          </div>
          <div style="display:flex;padding:8px 8px;border-bottom:1px solid #f0f0f0;font-size:11px">
            <div style="width:40px;color:#999">2</div>
            <div style="flex:1">dept_mgr</div>
            <div style="flex:1">部门经理</div>
            <div style="width:80px"><span style="background:#fff7e6;color:#fa8c16;padding:1px 6px;border-radius:2px;font-size:10px">业务角色</span></div>
            <div style="width:80px">本部门</div>
            <div style="width:60px"><span style="background:#f6ffed;color:#52c41a;padding:1px 6px;border-radius:2px;font-size:10px">启用</span></div>
            <div style="width:160px;display:flex;gap:4px;align-items:center">
              <a style="color:#1677ff;font-size:11px">详情</a>
              <a style="color:#1677ff;font-size:11px">更多 ▾</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A）纯表格 + 抽屉详情</h3>
      <p>搜索栏+操作栏+表格，点击详情右侧滑出抽屉</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#fff;border-radius:8px;padding:12px;font-size:11px;color:#333">
        <div style="display:flex;gap:12px">
          <div style="width:180px;border:1px solid #f0f0f0;border-radius:4px;padding:8px">
            <div style="font-weight:500;margin-bottom:8px">角色分类</div>
            <div style="padding:4px 8px;background:#e6f7ff;border-radius:4px;color:#1677ff;margin-bottom:4px">全部角色</div>
            <div style="padding:4px 8px;margin-bottom:4px;color:#666">系统角色</div>
            <div style="padding:4px 8px;color:#666">业务角色</div>
          </div>
          <div style="flex:1">
            <div style="display:flex;gap:8px;margin-bottom:8px">
              <div style="flex:1;border:1px solid #d9d9d9;border-radius:4px;padding:4px 8px;color:#999">角色名称</div>
              <div style="background:#1677ff;color:#fff;border-radius:4px;padding:4px 12px">查询</div>
            </div>
            <div style="border:1px solid #f0f0f0;border-radius:4px">
              <div style="display:flex;background:#fafafa;padding:6px 8px;border-bottom:1px solid #f0f0f0;font-weight:500">
                <div style="width:40px">序号</div>
                <div style="flex:1">角色编码</div>
                <div style="flex:1">角色名称</div>
                <div style="width:80px">数据范围</div>
                <div style="width:160px">操作</div>
              </div>
              <div style="padding:8px;font-size:11px;color:#999;text-align:center">表格内容...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B）左分类 + 右表格</h3>
      <p>左侧角色类型分类树，右侧表格筛选</p>
    </div>
  </div>
</div>
