<h2>菜单权限配置 - 两步式交互</h2>
<p class="subtitle">点击"菜单权限"按钮后的完整交互流程</p>

<div class="mockup">
  <div class="mockup-header">第一步：勾选菜单/按钮</div>
  <div class="mockup-body">
    <div style="background:#fff;border-radius:8px;padding:16px;font-size:11px;color:#333">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0;font-size:14px">菜单权限配置 - 系统管理员</h3>
        <div style="display:flex;gap:8px">
          <div style="border:1px solid #d9d9d9;border-radius:4px;padding:4px 12px;font-size:11px">取消</div>
          <div style="background:#1677ff;color:#fff;border-radius:4px;padding:4px 12px;font-size:11px">下一步：配置时效</div>
        </div>
      </div>
      <div style="border:1px solid #f0f0f0;border-radius:4px;padding:12px">
        <div style="margin-bottom:4px">
          <label><input type="checkbox" checked style="margin-right:4px"> <b>系统管理</b></label>
        </div>
        <div style="margin-left:20px;margin-bottom:4px">
          <label><input type="checkbox" checked style="margin-right:4px"> 用户管理</label>
        </div>
        <div style="margin-left:40px;margin-bottom:4px;color:#999;font-size:10px">
          <label><input type="checkbox" checked style="margin-right:4px"> 新增用户</label>
          <label><input type="checkbox" checked style="margin-right:4px;margin-left:8px"> 编辑用户</label>
          <label><input type="checkbox" style="margin-right:4px;margin-left:8px"> 删除用户</label>
        </div>
        <div style="margin-left:20px;margin-bottom:4px">
          <label><input type="checkbox" checked style="margin-right:4px"> 部门管理</label>
        </div>
        <div style="margin-left:40px;margin-bottom:4px;color:#999;font-size:10px">
          <label><input type="checkbox" checked style="margin-right:4px"> 新增部门</label>
          <label><input type="checkbox" style="margin-right:4px;margin-left:8px"> 删除部门</label>
        </div>
        <div style="margin-bottom:4px">
          <label><input type="checkbox" style="margin-right:4px"> <b>安全中心</b></label>
        </div>
        <div style="margin-left:20px;margin-bottom:4px">
          <label><input type="checkbox" style="margin-right:4px"> 菜单管理</label>
        </div>
        <div style="margin-left:20px;margin-bottom:4px">
          <label><input type="checkbox" style="margin-right:4px"> 角色管理</label>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mockup" style="margin-top:16px">
  <div class="mockup-header">第二步：配置时效</div>

    <div style="background:#fff;border-radius:8px;padding:16px;font-size:11px;color:#333">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0;font-size:14px">时效配置 - 系统管理员</h3>
        <div style="display:flex;gap:8px">
          <div style="border:1px solid #d9d9d9;border-radius:4px;padding:4px 12px;font-size:11px">上一步</div>
          <div style="border:1px solid #d9d9d9;border-radius:4px;padding:4px 12px;font-size:11px">取消</div>
          <div style="background:#1677ff;color:#fff;border-radius:4px;padding:4px 12px;font-size:11px">保存</div>
        </div>
      </div>
      <div style="margin-bottom:8px;padding:6px 10px;background:#e6f7ff;border-radius:4px;color:#1677ff;font-size:10px">
        💡 勾选多个菜单后点击"批量设置时效"可统一配置，也可逐行单独设置
      </div>
      <div style="border:1px solid #f0f0f0;border-radius:4px">
        <div style="display:flex;background:#fafafa;padding:6px 8px;border-bottom:1px solid #f0f0f0;font-weight:500;font-size:10px">

          <div style="flex:1">菜单/按钮</div>

          <div style="width:30px"><input type="checkbox"></div>
          <div style="flex:1">用户管理</div>
          <div style="width:100px">
            <select style="width:90px;padding:2px 4px;border:1px solid #d9d9d9;border-radius:2px;font-size:10px">
              <option>永久</option>
              <option>绝对时间</option>
              <option>周期性</option>
            </select>
          </div>
          <div style="flex:1;color:#999">—</div>
        </div>
        <div style="display:flex;padding:6px 8px;border-bottom:1px solid #f0f0f0;align-items:center;font-size:10px">
          <div style="width:30px"><input type="checkbox"></div>
          <div style="flex:1">新增用户</div>
          <div style="width:100px">
            <select style="width:90px;padding:2px 4px;border:1px solid #d9d9d9;border-radius:2px;font-size:10px">
              <option>永久</option>
              <option selected>绝对时间</option>
              <option>周期性</option>
            </select>
          </div>
          <div style="flex:1">
            <span style="border:1px solid #d9d9d9;border-radius:2px;padding:2px 6px;font-size:9px">2026-05-01 08:00</span>
            <span style="margin:0 4px">~</span>
            <span style="border:1px solid #d9d9d9;border-radius:2px;padding:2px 6px;font-size:9px">2026-12-31 18:00</span>
          </div>
        </div>
        <div style="display:flex;padding:6px 8px;border-bottom:1px solid #f0f0f0;align-items:center;font-size:10px">
          <div style="width:30px"><input type="checkbox"></div>
          <div style="flex:1">编辑用户</div>
          <div style="width:100px">
            <select style="width:90px;padding:2px 4px;border:1px solid #d9d9d9;border-radius:2px;font-size:10px">
              <option>永久</option>
              <option>绝对时间</option>
              <option selected>周期性</option>
            </select>
          </div>
          <div style="flex:1;font-size:9px">
            <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
              <select style="padding:2px 4px;border:1px solid #d9d9d9;border-radius:2px;font-size:9px">
                <option selected>按周</option>
                <option>按月</option>
              </select>
              <span style="border:1px solid #d9d9d9;border-radius:2px;padding:2px 6px">周一~周五</span>
              <span style="border:1px solid #d9d9d9;border-radius:2px;padding:2px 6px">09:00</span>

              <span style="border:1px solid #d9d9d9;border-radius:2px;padding:2px 6px">18:00</span>
            </div>
          </div>
        </div>
        <div style="display:flex;padding:6px 8px;align-items:center;font-size:10px">
          <div style="width:30px"><input type="checkbox"></div>
          <div style="flex:1">部门管理</div>
          <div style="width:100px">
            <select style="width:90px;padding:2px 4px;border:1px solid #d9d9d9;border-radius:2px;font-size:10px">
              <option>永久</option>
              <option>绝对时间</option>
              <option>周期性</option>
            </select>
          </div>
          <div style="flex:1;color:#999">—</div>
        </div>
      </div>
    </div>
  </div>
</div>
