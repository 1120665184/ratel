server:
  port: 8805

spring:
  application:
      name: gwsu-headless
  profiles:
    active: dev
  # 智能体流式响应可能耗时较长，默认30s超时不够，设为5分钟
  mvc:
    async:
      request-timeout: 300s
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
      namespace: gwsu
      config:
        enabled: true
        namespace: ${spring.cloud.nacos.namespace}
        group: ${spring.cloud.nacos.group}
      discovery:
        enabled: true
        namespace: ${spring.cloud.nacos.namespace}
        group: ${spring.cloud.nacos.group}
  config:
    import:
      - nacos:common.yaml
      - nacos:common-redis.yaml
      - nacos:common-database.yaml
      - nacos:${spring.application.name}.yaml
