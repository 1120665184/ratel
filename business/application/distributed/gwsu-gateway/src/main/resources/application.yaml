server:
  port: 8888

spring:
  application:
    name: gwsu-gateway
  profiles:
    active: dev
  reactor:
    context-propagation: auto
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
      namespace: gwsu
      config:
        enabled: true
        namespace: ${spring.cloud.nacos.namespace}
        group: ${spring.cloud.nacos.group}
      discovery:
        enabled: true
        namespace: ${spring.cloud.nacos.namespace}
        group: ${spring.cloud.nacos.group}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              include-expression: "metadata['prefix'] != null && metadata['prefix'] != ''"
              predicates:
                - name: Path
                  args:
                    pattern: "'/'+(metadata['prefix'] ?: serviceId)+'/**'"
              filters:
                - name: RewritePath
                  args:
                    regexp: "'/' + (metadata['prefix'] ?: serviceId) + '/?(?<remaining>.*)'"
                    replacement: "'/${remaining}'"
  config:
    import:
      - nacos:common.yaml
      - nacos:common-redis.yaml
      - nacos:${spring.application.name}.yaml