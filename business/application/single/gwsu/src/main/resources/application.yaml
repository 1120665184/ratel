server:
  port: 8888

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  application:
    name: gwsu-application
  reactor:
    context-propagation: auto
  threads:
    virtual:
      enabled: true
  config:
    import:
      - classpath:database.yaml
      - classpath:redis.yaml

# mybatis配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: org.quyq.gwsu.**.domain,org.quyq.gwsu.**.vo
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  type-handlers-package: org.quyq.gwsu.common.database.typehandler

org.quyq:
  auth:
    # 登录超时
    timeout: 18000
    is-concurrent: true
  security:
    ignore-urls:
      - /system/auth/**
    auth-allow-urls:
      - /modules/list
      - /system/workspace/**


logging:
  level:
    org.springframework.context.support: ERROR
    org.quyq: DEBUG
